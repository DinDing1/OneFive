name: 构建壹伍 OneFive

on:
  push:
    branches: ['main', 'master']
    tags: ['onefive-v*']
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（留空则读取 VERSION 文件）'
        required: false
        default: ''
      create_release:
        description: '创建 GitHub Release'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ========== Job 1: 构建前端（只需一次，不依赖架构） ==========
  build-frontend:
    runs-on: ubuntu-latest
    name: 构建前端
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: 构建前端
        run: |
          cd frontend
          rm -rf node_modules package-lock.json
          npm install
          npm run build
          echo "前端构建完成"

      - name: 上传前端产物
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  # ========== Job 2: 编译 x86 后端 ==========
  build-backend-x86:
    runs-on: ubuntu-latest
    name: 编译后端 x86_64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译 Python 后端 (Nuitka)
        run: |
          mkdir -p /tmp/nuitka-out
          echo "在 x86 runner 上编译..."
          docker run --rm --platform linux/amd64 \
            -v $PWD/backend:/build \
            -v /tmp/nuitka-out:/output \
            python:3.12-slim-bookworm \
            bash -c "
              apt-get update -qq && apt-get install -y -qq patchelf gcc > /dev/null &&
              pip install nuitka ordered-set --quiet &&
              pip install --no-cache-dir -U -r /build/requirements.txt &&
              python -c 'import importlib.metadata as m; print("BUILD p115client", m.version("p115client"))' &&
              python -c 'import p115client, p115client.tool.download as d; print("BUILD p115 path", p115client.__file__); print("BUILD download", d.__file__)' &&
              cd /build/src &&
              python -m nuitka --standalone \
                --lto=no \
                --include-package=onefive \
                --include-package=onefive.api \
                --include-package=onefive.db \
                --include-package=onefive.models \
                --include-package=onefive.services \
                --include-package=onefive.notification \
                --include-package=onefive.notification.telegram \
                --include-module=uvicorn \
                --include-module=uvicorn.lifespan.on \
                --include-module=uvicorn.lifespan.off \
                --include-module=uvicorn.protocols.websockets.auto \
                --include-module=uvicorn.protocols.websockets.wsproto_impl \
                --include-module=uvicorn.protocols.websockets.websockets_impl \
                --include-module=uvicorn.protocols.http.auto \
                --include-module=uvicorn.protocols.http.h11_impl \
                --include-module=uvicorn.protocols.http.httptools_impl \
                --include-module=uvicorn.logging \
                --include-module=uvicorn.loops \
                --include-module=uvicorn.loops.auto \
                --include-module=uvicorn.loops.asyncio \
                --include-module=fastapi \
                --include-module=starlette \
                --include-module=starlette.middleware \
                --include-module=starlette.middleware.cors \
                --include-module=starlette.routing \
                --include-module=starlette.requests \
                --include-module=starlette.responses \
                --include-module=multipart \
                --include-package=p115client \
                --include-package-data=p115client \
                --include-distribution-metadata=p115client \
                --include-module=p115nano302 \
                --include-module=telethon \
                --include-module=guessit \
                --include-package=babelfish \
                --include-package-data=babelfish \
                --include-package-data=guessit \
                --include-package-data=rebulk \
                --include-package=blacksheep \
                --include-package-data=blacksheep \
                --include-module=orjson \
                --include-module=qrcode \
                --include-module=PIL \
                --include-package=urllib3 \
                --include-module=urllib3.contrib.resolver.system \
                --include-package=urllib3_future \
                --include-module=urllib3_future.contrib.resolver.system \
                --output-filename=onefive-server \
                --output-dir=/output \
                run.py &&
              echo '编译完成'
            "
          echo "x86 编译完成"
          # standalone 产出为 *.dist 目录（内含 onefive-server 与依赖），规范化到 server-dist 便于打包
          DIST_DIR=$(find /tmp/nuitka-out -maxdepth 1 -type d -name '*.dist' | head -n 1)
          if [ -z "$DIST_DIR" ] || [ ! -d "$DIST_DIR" ]; then
            echo "错误: 未找到 Nuitka standalone 输出目录 (*.dist)"
            ls -la /tmp/nuitka-out || true
            exit 1
          fi
          rm -rf /tmp/server-dist
          mkdir -p /tmp/server-dist
          cp -a "$DIST_DIR"/. /tmp/server-dist/
          if [ ! -f /tmp/server-dist/onefive-server ]; then
            echo "错误: standalone 目录中缺少 onefive-server"
            ls -la /tmp/server-dist | head -n 50
            exit 1
          fi
          chmod +x /tmp/server-dist/onefive-server
          echo "standalone 入口与依赖："
          ls -lh /tmp/server-dist/onefive-server
          du -sh /tmp/server-dist

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-x86_64
          path: /tmp/server-dist/
          retention-days: 1

  # ========== Job 3: 编译 ARM 后端 ==========
  build-backend-arm:
    runs-on: ubuntu-24.04-arm
    name: 编译后端 arm64
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 编译 Python 后端 (Nuitka)
        run: |
          mkdir -p /tmp/nuitka-out
          echo "在 ARM 原生 runner 上编译..."
          docker run --rm --platform linux/arm64 \
            -v $PWD/backend:/build \
            -v /tmp/nuitka-out:/output \
            python:3.12-slim-bookworm \
            bash -c "
              apt-get update -qq && apt-get install -y -qq patchelf gcc > /dev/null &&
              pip install nuitka ordered-set --quiet &&
              pip install --no-cache-dir -U -r /build/requirements.txt &&
              python -c 'import importlib.metadata as m; print("BUILD p115client", m.version("p115client"))' &&
              python -c 'import p115client, p115client.tool.download as d; print("BUILD p115 path", p115client.__file__); print("BUILD download", d.__file__)' &&
              cd /build/src &&
              python -m nuitka --standalone \
                --lto=no \
                --include-package=onefive \
                --include-package=onefive.api \
                --include-package=onefive.db \
                --include-package=onefive.models \
                --include-package=onefive.services \
                --include-package=onefive.notification \
                --include-package=onefive.notification.telegram \
                --include-module=uvicorn \
                --include-module=uvicorn.lifespan.on \
                --include-module=uvicorn.lifespan.off \
                --include-module=uvicorn.protocols.websockets.auto \
                --include-module=uvicorn.protocols.websockets.wsproto_impl \
                --include-module=uvicorn.protocols.websockets.websockets_impl \
                --include-module=uvicorn.protocols.http.auto \
                --include-module=uvicorn.protocols.http.h11_impl \
                --include-module=uvicorn.protocols.http.httptools_impl \
                --include-module=uvicorn.logging \
                --include-module=uvicorn.loops \
                --include-module=uvicorn.loops.auto \
                --include-module=uvicorn.loops.asyncio \
                --include-module=fastapi \
                --include-module=starlette \
                --include-module=starlette.middleware \
                --include-module=starlette.middleware.cors \
                --include-module=starlette.routing \
                --include-module=starlette.requests \
                --include-module=starlette.responses \
                --include-module=multipart \
                --include-package=p115client \
                --include-package-data=p115client \
                --include-distribution-metadata=p115client \
                --include-module=p115nano302 \
                --include-module=telethon \
                --include-module=guessit \
                --include-package=babelfish \
                --include-package-data=babelfish \
                --include-package-data=guessit \
                --include-package-data=rebulk \
                --include-package=blacksheep \
                --include-package-data=blacksheep \
                --include-module=orjson \
                --include-module=qrcode \
                --include-module=PIL \
                --include-package=urllib3 \
                --include-module=urllib3.contrib.resolver.system \
                --include-package=urllib3_future \
                --include-module=urllib3_future.contrib.resolver.system \
                --output-filename=onefive-server \
                --output-dir=/output \
                run.py &&
              echo '编译完成'
            "
          echo "ARM 编译完成"
          # standalone 产出为 *.dist 目录（内含 onefive-server 与依赖），规范化到 server-dist 便于打包
          DIST_DIR=$(find /tmp/nuitka-out -maxdepth 1 -type d -name '*.dist' | head -n 1)
          if [ -z "$DIST_DIR" ] || [ ! -d "$DIST_DIR" ]; then
            echo "错误: 未找到 Nuitka standalone 输出目录 (*.dist)"
            ls -la /tmp/nuitka-out || true
            exit 1
          fi
          rm -rf /tmp/server-dist
          mkdir -p /tmp/server-dist
          cp -a "$DIST_DIR"/. /tmp/server-dist/
          if [ ! -f /tmp/server-dist/onefive-server ]; then
            echo "错误: standalone 目录中缺少 onefive-server"
            ls -la /tmp/server-dist | head -n 50
            exit 1
          fi
          chmod +x /tmp/server-dist/onefive-server
          echo "standalone 入口与依赖："
          ls -lh /tmp/server-dist/onefive-server
          du -sh /tmp/server-dist

      - name: 上传后端产物
        uses: actions/upload-artifact@v4
        with:
          name: backend-arm64
          path: /tmp/server-dist/
          retention-days: 1

  # ========== Job 4: 组装并打包 FPK ==========
  package:
    needs: [build-frontend, build-backend-x86, build-backend-arm]
    runs-on: ubuntu-latest
    name: 打包 ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            fnpack_platform: x86
          - arch: arm64
            fnpack_platform: arm
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 确定版本号
        id: version
        run: |
          VERSION_FILE="VERSION"
          MANIFEST_VER=$(grep '^version' onefive/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          elif [[ "${{ github.ref }}" == refs/tags/onefive-v* ]]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#onefive-v}"
          elif [ -f "$VERSION_FILE" ]; then
            VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
          else
            VERSION="${MANIFEST_VER}"
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "版本号: $VERSION"

      - name: 下载前端产物
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: 下载后端产物
        uses: actions/download-artifact@v4
        with:
          name: backend-${{ matrix.arch }}
          path: /tmp/nuitka-out/

      - name: 组装应用文件
        run: |
          # 前端构建产物 -> onefive/app/ui/
          # 飞牛 fnpack 会把 app/ 下的内容安装到 TRIM_APPDEST（即 /vol*/@appcenter/onefive/）
          mkdir -p onefive/app/ui

          # 备份飞牛应用入口配置和图标，避免被前端构建产物覆盖
          cp onefive/app/ui/config /tmp/onefive-ui-config
          cp -r onefive/app/ui/images /tmp/onefive-ui-images

          # 清理上次构建残留的前端产物
          rm -rf onefive/app/ui/assets onefive/app/ui/*.html onefive/app/ui/*.js onefive/app/ui/*.css onefive/app/ui/*.svg onefive/app/ui/*.png

          # 拷贝前端构建产物
          cp -r frontend/dist/* onefive/app/ui/

          # 恢复飞牛应用入口配置和图标
          cp /tmp/onefive-ui-config onefive/app/ui/config
          rm -rf onefive/app/ui/images
          cp -r /tmp/onefive-ui-images onefive/app/ui/images

          # 后端 standalone 目录 -> onefive/app/server/
          # 安装后：${TRIM_APPDEST}/server/onefive-server + 同目录依赖
          # 下载产物在 /tmp/nuitka-out/（upload 的 server-dist 内容）
          rm -rf onefive/app/server
          mkdir -p onefive/app/server
          # artifact 可能是扁平文件，或带一层目录，这里兼容两种布局
          if [ -f /tmp/nuitka-out/onefive-server ]; then
            cp -a /tmp/nuitka-out/. onefive/app/server/
          elif [ -f /tmp/nuitka-out/server-dist/onefive-server ]; then
            cp -a /tmp/nuitka-out/server-dist/. onefive/app/server/
          else
            # 再尝试任意子目录中的入口
            FOUND=$(find /tmp/nuitka-out -type f -name onefive-server | head -n 1)
            if [ -z "$FOUND" ]; then
              echo "错误: 下载的后端产物中找不到 onefive-server"
              find /tmp/nuitka-out -maxdepth 3 -type f | head -n 80 || true
              exit 1
            fi
            cp -a "$(dirname "$FOUND")"/. onefive/app/server/
          fi
          chmod +x onefive/app/server/onefive-server
          # 去掉可能混入的构建垃圾
          rm -rf onefive/app/server/__pycache__

          if [ ! -f onefive/app/server/onefive-server ]; then
            echo "错误: 组装后缺少 onefive/app/server/onefive-server"
            ls -la onefive/app/server/ | head -n 50
            exit 1
          fi

          echo "应用文件组装完成（standalone）"
          ls -lh onefive/app/server/onefive-server
          du -sh onefive/app/server
          ls -la onefive/app/ui/ | head -n 30

      - name: 更新 manifest
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          PLATFORM="${{ matrix.fnpack_platform }}"
          sed -i "s/^version.*/version=${VERSION}/" onefive/manifest
          sed -i "s/^platform.*/platform=${PLATFORM}/" onefive/manifest

      - name: 修复脚本权限
        run: |
          cd onefive
          for f in cmd/main cmd/install_init cmd/install_callback cmd/uninstall_init cmd/uninstall_callback cmd/upgrade_init cmd/upgrade_callback cmd/config_init cmd/config_callback; do
            [ -f "$f" ] && sed -i 's/\r$//' "$f" && chmod +x "$f"
          done

      - name: 下载 fnpack 并打包
        run: |
          curl -fsSL -o /tmp/fnpack https://static2.fnnas.com/fnpack/fnpack-1.2.1-linux-amd64
          chmod +x /tmp/fnpack
          cd onefive
          /tmp/fnpack build --directory .
          FPKN=$(ls *.fpk)
          mv "$FPKN" onefive-${{ matrix.arch == 'x86_64' && 'X86' || 'ARM' }}.fpk
          echo "构建完成: $(ls -lh onefive-*.fpk)"

      - name: 上传 FPK
        uses: actions/upload-artifact@v4
        with:
          name: onefive-${{ matrix.arch }}
          path: onefive/onefive-*.fpk
          retention-days: 30

  # ========== Job 5: 创建 Release ==========
  release:
    needs: package
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/onefive-v') || github.event.inputs.create_release == 'true'
    permissions:
      contents: write
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载所有 FPK
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts/

      - name: 删除旧版本 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RELEASES=$(gh release list --limit 100 --json tagName --jq '.[].tagName' 2>/dev/null || echo "")
          echo "$RELEASES" | while read -r tag; do
            case "$tag" in onefive-*) gh release delete "${tag}" --yes --cleanup-tag 2>/dev/null || true;; esac
          done

      - name: 确定构建信息
        id: info
        run: |
          VERSION_FILE="VERSION"
          MANIFEST_VER=$(grep '^version' onefive/manifest | awk -F'=' '{print $2}' | tr -d ' ')
          if [[ "${{ github.ref }}" == refs/tags/onefive-v* ]]; then
            TAG="${{ github.ref_name }}" && VERSION="${TAG#onefive-v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            TAG="onefive-v${{ github.event.inputs.version }}" && VERSION="${{ github.event.inputs.version }}"
          elif [ -f "$VERSION_FILE" ]; then
            VERSION=$(cat "$VERSION_FILE" | tr -d '[:space:]')
            TAG="onefive-v${VERSION}"
          else
            TAG="onefive-v${MANIFEST_VER}" && VERSION="${MANIFEST_VER}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "build_time=$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M CST')" >> $GITHUB_OUTPUT

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.info.outputs.tag }}
          name: "壹伍 v${{ steps.info.outputs.version }}"
          files: ./artifacts/**/*.fpk
          generate_release_notes: false
          body: |
            ## 壹伍 v${{ steps.info.outputs.version }}

            飞牛OS上的115云盘管理应用，支持文件管理、分享整理、媒体识别、Telegram通知等功能。

            ### 下载
            | 文件 | 架构 | 适用设备 |
            |------|------|----------|
            | `onefive-X86.fpk` | x86_64 | Intel/AMD NAS |
            | `onefive-ARM.fpk` | arm64 | ARM NAS |

            ---
            构建时间：${{ steps.info.outputs.build_time }}
